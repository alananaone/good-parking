name: 自動同步雙北路邊停車即時數據與時序日誌

on:
  schedule:
    # 每 5 分鐘自動同步一次（供快速驗證與高頻即時在席更新）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支援在 GitHub 網頁端手動一鍵觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 GitHub Actions 推送更新至儲存庫

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行即時在席數據建置與日誌封存
        run: |
          python3 build_live_data.py

      - name: 自動提交並推送變更至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api_data/live_roads.json history/
          # 若有資料更新則提交，先 rebase 再推送，加上 [skip ci] 避免無窮循環觸發
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自動同步雙北即時路邊停車在席數據 [skip ci]" && git pull --rebase origin main && git push)

